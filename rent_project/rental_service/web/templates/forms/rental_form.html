<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Новая аренда</title>
<style>body{background:#0e1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{width:100%;max-width:900px;background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px}label{display:block;font-size:12px;color:rgba(230,237,243,.55);margin-bottom:6px}input,select{width:95%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#1c2130;color:#e6edf3}.btn-danger { background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.3); color:var(--red); border-radius:10px; padding: 10px; cursor:pointer; }.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.btn{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(79,172,254,.12);border:1px solid rgba(79,172,254,.3);color:#4facfe;cursor:pointer}.link{margin-left:8px;color:rgba(230,237,243,.7)}.err{color:#f85149;margin-bottom:8px}input { width:87%; }</style></head>
<body><div class="card"><h2>Создать аренду</h2>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="grid"><div><label>Клиент *</label><select name="client_id" required><option value="">—</option>{% for c in clients %}<option value="{{ c.id }}">{{ c.full_name }}</option>{% endfor %}</select></div><div><label>Снаряжение *</label><select name="equipment_ids" multiple size="8" required>{% for e in equipments %}<option value="{{ e.id }}">{{ e.name }} ({{ e.price_per_day }})</option>{% endfor %}</select></div><div><label>Дни *</label><input name="days" type="number" min="1" value="1" required></div><div><label>Дата начала *</label><input name="start_date" type="date" required></div><div><label>Статус</label><select name="status"><option value="draft">draft</option><option value="open">open</option><option value="booked">booked</option><option value="rented">rented</option></select></div></div>
</br>
    <button class="btn" type="submit">Сохранить</button><a class="link" href="{% url 'dashboard' %}"><button class="btn-danger" type="button">Отмена</button></a></form></div></body>
</html>
