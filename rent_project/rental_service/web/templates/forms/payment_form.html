<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Новый платеж</title>
<style>body{background:#0e1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{width:100%;max-width:700px;background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px}label{display:block;font-size:12px;color:rgba(230,237,243,.55);margin-bottom:6px}input,select{width:95%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#1c2130;color:#e6edf3}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.btn{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(79,172,254,.12);border:1px solid rgba(79,172,254,.3);color:#4facfe;cursor:pointer}.link{margin-left:10px;color:rgba(230,237,243,.7)}.err{color:#f85149;margin-bottom:8px}.btn-danger { background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.3); color:var(--red); border-radius:10px; padding: 10px; cursor:pointer; }input { width:87%; }</style></head>
<body><div class="card"><h2>Создать платеж</h2>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="grid"><div><label>Договор *</label><select name="rental_id" required><option value="">—</option>{% for r in rentals_for_select %}<option value="{{ r.id }}">{{ r.contract_number }} — {{ r.client.full_name }}</option>{% endfor %}</select></div><div><label>Метод *</label><input name="payment_method" placeholder="VISA MasterCard" required></div><div><label>Сумма *</label><input name="amount" type="number" step="0.01" required></div></div></br><button class="btn" type="submit">Сохранить</button><a class="link" href="{% url 'dashboard' %}"><button class="btn-danger" type="button">Отмена</button></a></form></div></body>
</html>
