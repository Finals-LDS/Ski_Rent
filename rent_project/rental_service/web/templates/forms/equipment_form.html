<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новое снаряжение</title>

  <style>
    body {
      background: #0e1117;
      color: #e6edf3;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 860px;
      background: #161b22;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      color: rgba(230,237,243,.55);
      margin-bottom: 6px;
    }

    input, select {
      width: 95%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.08);
      background: #1c2130;
      color: #e6edf3;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .link {
      margin-left: 8px;
      color: rgba(230,237,243,.7);
    }

    .err {
      color: #f85149;
      margin-bottom: 8px;
    }

    input {
      width: 87%;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid;
      transition: all .15s;
    }

    .btn-primary {
      background: rgba(79,172,254,.12);
      border-color: rgba(79,172,254,.35);
      color: #4facfe;
    }

    .btn-primary:hover {
      background: rgba(79,172,254,.2);
    }

    .btn-danger {
      background: rgba(248,81,73,.1);
      border-color: rgba(248,81,73,.3);
      color: #f85149;
    }

    .btn-danger:hover {
      background: rgba(248,81,73,.2);
    }
  
    .size-row input {
      width: 90%;
    }

    .remove-size {
      height: 42px;
      min-width: 42px;
      padding: 0;
    }
  
  /* ═══════════════════════════════════════════
     MOBILE RESPONSIVE
  ═══════════════════════════════════════════ */
  @media (max-width: 768px) {
    body { padding: 16px 12px !important; align-items: flex-start !important; }
    .card { padding: 20px 16px !important; border-radius: 10px !important; }

    .grid3 { grid-template-columns: 1fr !important; }
    .grid2 { grid-template-columns: 1fr !important; }

    .item-row {
      grid-template-columns: 1fr 1fr !important;
      gap: 8px !important;
    }
    .item-row > *:nth-child(1) { grid-column: 1 / -1; }

    .total-bar { flex-wrap: wrap !important; justify-content: flex-start !important; }

    .actions { flex-wrap: wrap !important; }
    .actions .btn { flex: 1 1 auto; text-align: center; }
  }

  @media (max-width: 480px) {
    .item-row { grid-template-columns: 1fr !important; }
    .item-row > * { grid-column: 1 !important; }
  }

  </style>
</head>

<body>
  <div class="card">

    <h2>
      {% if equipment %}Редактирование снаряжения{% else %}Создать снаряжение{% endif %}
    </h2>

    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="grid">

        <div>
          <label>Тип *</label>
          <select name="equipment_type_id">
            <option value="">—</option>
            {% for t in equipment_types %}
              <option value="{{ t.id }}"
                {% if equipment and equipment.type_id == t.id %}selected{% endif %}>
                {{ t.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label>Новый тип</label>
          <input name="equipment_type_name" />
        </div>

        <div>
          <label>Название *</label>
          <input name="equipment_name" value="{{ equipment.name|default:'' }}" required />
        </div>

        <div>
          <label>Цена/день *</label>
          <input
            name="price_per_day"
            type="number"
            step="0.01"
            value="{{ equipment.price_per_day|default:'' }}"
            required
          />
        </div>

      </div>

      <br />

      <div>
        <div id="sizes-container">

          {% if equipment and equipment.sizes.all %}
            {% for size in equipment.sizes.all %}
              <div class="size-row" style="display:grid; grid-template-columns:1fr 1fr auto; gap:12px; margin-bottom:12px; align-items:end;">

                <div>
                  <label>Размер</label>
                  <input
                    type="text"
                    name="sizes[]"
                    value="{{ size.size }}"
                    required
                  />
                </div>

                <div>
                  <label>Количество</label>
                  <input
                    type="number"
                    name="quantities[]"
                    min="1"
                    value="{{ size.quantity }}"
                    required
                  />
                </div>

                <button type="button" class="btn btn-danger remove-size">
                  ✕
                </button>

              </div>
            {% endfor %}
          {% else %}

            <div class="size-row" style="display:grid; grid-template-columns:1fr 1fr auto; gap:12px; margin-bottom:12px; align-items:end;">

              <div>
                <label>Размер</label>
                <input
                  type="text"
                  name="sizes[]"
                  required
                />
              </div>

              <div>
                <label>Количество</label>
                <input
                  type="number"
                  name="quantities[]"
                  min="1"
                  value="1"
                  required
                />
              </div>

              <button type="button" class="btn btn-danger remove-size">
                ✕
              </button>

            </div>

          {% endif %}

        </div>

        <button type="button" id="add-size" class="btn btn-primary">
          + Добавить размер
        </button>
      </div>

      <br />

      <div class="grid">

        <div>
          <label>Статус</label>
          <select name="status">
            <option value="available" {% if equipment and equipment.status == 'available' %}selected{% endif %}>
              available
            </option>
            <option value="rented" {% if equipment and equipment.status == 'rented' %}selected{% endif %}>
              rented
            </option>
            <option value="repair" {% if equipment and equipment.status == 'repair' %}selected{% endif %}>
              repair
            </option>
          </select>
        </div>

      </div>

      <br />

      <button class="btn btn-primary" type="submit">Сохранить</button>

      <script>
        document.querySelector('form').addEventListener('submit', function(e) {
          const typeSelect = document.querySelector('select[name="equipment_type_id"]');
          const newType = document.querySelector('input[name="equipment_type_name"]');

          const hasExistingType = typeSelect && typeSelect.value.trim() !== '';
          const hasNewType = newType && newType.value.trim() !== '';

          if (!hasExistingType && !hasNewType) {
            e.preventDefault();
            alert('Выберите тип или введите новый тип');
          }

          const sizeInputs = document.querySelectorAll('input[name="sizes[]"]');
          const quantityInputs = document.querySelectorAll('input[name="quantities[]"]');

          if (!sizeInputs.length || !quantityInputs.length) {
            e.preventDefault();
            alert('Добавьте хотя бы один размер');
            return;
          }
        });
      </script>

      <script>
        const container = document.getElementById('sizes-container');
        const addBtn = document.getElementById('add-size');

        function attachRemoveHandlers() {
          document.querySelectorAll('.remove-size').forEach(btn => {
            btn.onclick = function() {
              const rows = document.querySelectorAll('.size-row');

              if (rows.length <= 1) {
                alert('Должен остаться хотя бы один размер');
                return;
              }

              this.closest('.size-row').remove();
            };
          });
        }

        addBtn.addEventListener('click', function() {
          const row = document.createElement('div');

          row.className = 'size-row';
          row.style.display = 'grid';
          row.style.gridTemplateColumns = '1fr 1fr auto';
          row.style.gap = '12px';
          row.style.marginBottom = '12px';
          row.style.alignItems = 'end';

          row.innerHTML = `
            <div>
              <label>Размер</label>
              <input type="text" name="sizes[]" required />
            </div>

            <div>
              <label>Количество</label>
              <input type="number" name="quantities[]" min="1" value="1" required />
            </div>

            <button type="button" class="btn btn-danger remove-size">✕</button>
          `;

          container.appendChild(row);
          attachRemoveHandlers();
        });

        attachRemoveHandlers();
      </script>

      <a class="link" href="{% url 'dashboard' %}">
        <button class="btn btn-danger" type="button">Отмена</button>
      </a>

    </form>
  </div>
</body>
</html>
