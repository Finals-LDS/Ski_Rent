<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Новое снаряжение</title>
<style>body{background:#0e1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{width:100%;max-width:860px;background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px}label{display:block;font-size:12px;color:rgba(230,237,243,.55);margin-bottom:6px}input,select{width:95%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#1c2130;color:#e6edf3}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.btn{margin-top:8px;padding:10px 18px;border-radius:10px;background:rgba(79,172,254,.12);border:1px solid rgba(79,172,254,.3);color:#4facfe;cursor:pointer;font-size:14px;font-weight:600}.btn:hover{background:rgba(79,172,254,.2)}.err{color:#f85149;margin-bottom:8px}.btn-danger{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:#f85149;border-radius:10px;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}.btn-danger:hover{background:rgba(248,81,73,.2)}input{width:87%}</style></head>
<body><div class="card"><h2>{% if equipment %}Редактирование снаряжения{% else %}Создать снаряжение{% endif %}</h2>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="grid"><div><label>Тип *</label><select name="equipment_type_id" required><option value="">—</option>{% for t in equipment_types %}<option value="{{ t.id }}" {% if equipment and equipment.type_id == t.id %}selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></div><div><label>Новый тип</label><input name="equipment_type_name"></div><div><label>Название *</label><input name="equipment_name" value="{{ equipment.name|default:'' }}" required></div><div><label>Размер *</label><input name="size" value="{{ equipment.size|default:'' }}" required></div><div><label>Цена/день *</label><input name="price_per_day" type="number" step="0.01" value="{{ equipment.price_per_day|default:'' }}" required></div><div><label>Количество *</label><input name="quantity" type="number" min="1" value="{{ equipment.quantity|default:'1' }}" required></div><div><label>Статус</label><select name="status"><option value="available" {% if equipment and equipment.status == 'available' %}selected{% endif %}>available</option><option value="rented" {% if equipment and equipment.status == 'rented' %}selected{% endif %}>rented</option><option value="repair" {% if equipment and equipment.status == 'repair' %}selected{% endif %}>repair</option></select></div></div></br><button class="btn" type="submit">Сохранить</button><a class="btn-danger" href="{% url 'dashboard' %}">Отмена</a></form></div></body>
</html>
