{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование аренды</title>
  <style>
    body { margin:0; min-height:100vh; background:#0e1117; color:#e6edf3; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; }
    .card { width:100%; max-width:520px; padding:24px; background:#161b22; border:1px solid rgba(255,255,255,.08); border-radius:14px; }
    h2 { margin:0 0 10px; } p { color:rgba(230,237,243,.55); margin:0 0 16px; }
    label { display:block; font-size:12px; color:rgba(230,237,243,.6); margin-bottom:6px; }
    input { width:95%; padding:10px 12px; background:#1c2130; border:1px solid rgba(255,255,255,.08); border-radius:10px; color:#e6edf3; margin-bottom:15px; }
    .link { margin-left:8px; color:rgba(230,237,243,.7); text-decoration:none; }
    .error { color:#f85149; margin-bottom:10px; font-size:13px; font-weight:700; }
    .btn { padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid; transition: all .15s; }
    .btn-primary { background: rgba(79,172,254,.12); border-color: rgba(79,172,254,.35); color: #4facfe; }
    .btn-primary:hover { background: rgba(79,172,254,.2); }
    .btn-danger  { background: rgba(248,81,73,.1);   border-color: rgba(248,81,73,.3);   color: #f85149; }
    .btn-danger:hover  { background: rgba(248,81,73,.2); }
     </style>
</head>
<body>
  <div class="card">
    <h2>Редактирование аренды - {{ rental.contract_number }}</h2>
    <p>Изменение дат договора</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Дата начала</label>
      <input type="date" name="start_date" value="{{ rental.start_date|date:'Y-m-d' }}">
      <label>Дата окончания</label>
      <input type="date" name="end_date" value="{{ rental.end_date|date:'Y-m-d' }}">

      <button class="btn btn-primary" type="submit">Сохранить</button>
      <a class="link" href="{% url 'dashboard' %}"><button class="btn btn-danger" type="button">Отмена</button></a>
    </form>
  </div>
</body>
</html>
