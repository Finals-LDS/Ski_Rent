{% load static %}
<!-- ИИ Помощник — плавающий чат (правый нижний угол) -->
<style>
  #ai-fab {
    position: fixed; bottom: 28px; right: 28px; z-index: 9999;
    width: 52px; height: 52px;
    background: linear-gradient(135deg, #4facfe, #a371f7);
    border-radius: 50%; border: none; cursor: pointer;
    box-shadow: 0 4px 20px rgba(79,172,254,0.45);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #ai-fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(79,172,254,0.55); }
  #ai-fab svg { width: 26px; height: 26px; fill: white; }
  #ai-fab .badge {
    position: absolute; top: 2px; right: 2px;
    width: 14px; height: 14px; background: #3fb950;
    border-radius: 50%; border: 2px solid #0e1117;
  }

  #ai-panel {
    position: fixed; bottom: 90px; right: 28px; z-index: 9998;
    width: 360px; max-height: 520px;
    background: #161b22; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; display: none; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    overflow: hidden;
    animation: aiSlideIn 0.2s ease;
  }
  #ai-panel.open { display: flex; }
  @keyframes aiSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .ai-header {
    padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-between;
    background: #1c2130;
  }
  .ai-header-left { display: flex; align-items: center; gap: 10px; }
  .ai-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #4facfe, #a371f7);
    display: flex; align-items: center; justify-content: center;
  }
  .ai-avatar svg { width: 18px; height: 18px; fill: white; }
  .ai-header-title { font-size: 14px; font-weight: 600; color: #e6edf3; }
  .ai-header-sub { font-size: 11px; color: rgba(230,237,243,0.5); }
  .ai-close {
    background: none; border: none; cursor: pointer;
    color: rgba(230,237,243,0.5); padding: 4px;
    border-radius: 6px; transition: color 0.15s;
  }
  .ai-close:hover { color: #e6edf3; }
  .ai-close svg { width: 18px; height: 18px; fill: currentColor; display: block; }

  .ai-messages {
    flex: 1; overflow-y: auto; padding: 14px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .ai-msg { max-width: 85%; font-size: 13px; line-height: 1.5; }
  .ai-msg.user {
    align-self: flex-end;
    background: rgba(79,172,254,0.15); border: 1px solid rgba(79,172,254,0.2);
    color: #e6edf3; border-radius: 12px 12px 4px 12px; padding: 9px 12px;
  }
  .ai-msg.bot {
    align-self: flex-start;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: #e6edf3; border-radius: 12px 12px 12px 4px; padding: 9px 12px;
    white-space: pre-wrap;
  }
  .ai-msg.typing { color: rgba(230,237,243,0.4); font-style: italic; }

  .ai-footer {
    padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #ai-input {
    flex: 1; padding: 9px 12px; background: rgba(28,33,48,0.8);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    color: #e6edf3; font-size: 13px; outline: none; resize: none;
    max-height: 100px; font-family: inherit; transition: border-color 0.15s;
    line-height: 1.4;
  }
  #ai-input:focus { border-color: rgba(79,172,254,0.4); }
  #ai-input::placeholder { color: rgba(230,237,243,0.35); }
  #ai-send {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #4facfe, #a371f7);
    border: none; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s;
  }
  #ai-send:hover { opacity: 0.85; }
  #ai-send svg { width: 18px; height: 18px; fill: white; }

  .ai-suggestions {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 0 12px 10px;
  }
  .ai-chip {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: rgba(79,172,254,0.08); border: 1px solid rgba(79,172,254,0.2);
    color: rgba(230,237,243,0.7); cursor: pointer; transition: background 0.15s;
    white-space: nowrap;
  }
  .ai-chip:hover { background: rgba(79,172,254,0.18); color: #4facfe; }
</style>

<!-- Кнопка открытия -->
<button id="ai-fab" title="ИИ Помощник">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
  <span class="badge"></span>
</button>

<!-- Панель чата -->
<div id="ai-panel">
  <div class="ai-header">
    <div class="ai-header-left">
      <div class="ai-avatar">
        <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h1a7 7 0 0 1 7 7H4a7 7 0 0 1 7-7h1V5.72c-.6-.34-1-.98-1-1.72a2 2 0 0 1 2-2zM7 14v1a5 5 0 0 0 10 0v-1H7zm4 3h2v2h-2v-2z"/></svg>
      </div>
      <div>
        <div class="ai-header-title">ИИ Помощник</div>
        <div class="ai-header-sub">Ski Rent — обучение персонала</div>
      </div>
    </div>
    <button class="ai-close" id="ai-close">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="ai-messages" id="ai-messages">
    <div class="ai-msg bot">Привет! 👋 Я ИИ-помощник Ski Rent. Помогу разобраться с работой системы. Спрашивайте!</div>
  </div>

  <div class="ai-suggestions" id="ai-suggestions">
    <span class="ai-chip" data-q="Как оформить новую аренду?">Как оформить аренду?</span>
    <span class="ai-chip" data-q="Как принять платёж?">Принять платёж</span>
    <span class="ai-chip" data-q="Как создать договор и получить подпись?">Создать договор</span>
    <span class="ai-chip" data-q="Как сделать возврат?">Возврат</span>
  </div>

  <div class="ai-footer">
    <textarea id="ai-input" rows="1" placeholder="Задайте вопрос..."></textarea>
    <button id="ai-send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  const fab      = document.getElementById('ai-fab');
  const panel    = document.getElementById('ai-panel');
  const closeBtn = document.getElementById('ai-close');
  const input    = document.getElementById('ai-input');
  const sendBtn  = document.getElementById('ai-send');
  const msgs     = document.getElementById('ai-messages');
  const chips    = document.querySelectorAll('.ai-chip');
  const suggBox  = document.getElementById('ai-suggestions');

  fab.addEventListener('click', () => {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) { input.focus(); }
  });
  closeBtn.addEventListener('click', () => panel.classList.remove('open'));

  function scrollBottom() {
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addMsg(text, role) {
    const div = document.createElement('div');
    div.className = 'ai-msg ' + role;
    div.textContent = text;
    msgs.appendChild(div);
    scrollBottom();
    return div;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    suggBox.style.display = 'none';
    addMsg(text, 'user');
    input.value = '';
    input.style.height = 'auto';

    const typing = addMsg('Печатаю…', 'bot typing');

    try {
      const resp = await fetch('/ai/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify({ message: text }),
      });
      const data = await resp.json();
      typing.remove();
      addMsg(data.reply || 'Нет ответа', 'bot');
    } catch(e) {
      typing.remove();
      addMsg('Ошибка соединения. Попробуйте позже.', 'bot');
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });

  chips.forEach(chip => {
    chip.addEventListener('click', () => sendMessage(chip.dataset.q));
  });

  function getCookie(name) {
    const val = `; ${document.cookie}`;
    const parts = val.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return '';
  }
})();
</script>
