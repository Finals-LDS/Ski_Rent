<!-- AI ASSISTANT WIDGET — Решид v2 -->
<style>
  #ai-widget-btn {
    position: fixed; bottom: 28px; right: 28px; z-index: 9999;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(79,172,254,0.45);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #ai-widget-btn:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(79,172,254,0.6); }
  #ai-widget-btn svg { width: 26px; height: 26px; fill: white; }
  #ai-widget-btn .badge {
    position: absolute; top: 0; right: 0;
    width: 16px; height: 16px;
    background: #3fb950; border-radius: 50%; border: 2px solid #0e1117;
  }
  #ai-chat-panel {
    position: fixed; bottom: 96px; right: 28px; z-index: 9998;
    width: 370px; height: 540px;
    background: #161b22; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px; box-shadow: 0 16px 60px rgba(0,0,0,0.5);
    display: none; flex-direction: column; overflow: hidden;
  }
  #ai-chat-panel.open { display: flex; }
  .ai-chat-header {
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(79,172,254,0.15), rgba(0,242,254,0.05));
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 12px;
  }
  .ai-chat-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ai-chat-avatar svg { width: 19px; height: 19px; fill: white; }
  .ai-chat-name { font-size: 13px; font-weight: 700; color: #e6edf3; }
  .ai-chat-status { font-size: 11px; color: #3fb950; margin-top: 1px; }
  .ai-chat-close {
    margin-left: auto; background: none; border: none; cursor: pointer;
    color: rgba(230,237,243,0.4); font-size: 20px; line-height: 1;
    padding: 4px 8px; border-radius: 6px; transition: color 0.15s, background 0.15s;
  }
  .ai-chat-close:hover { color: #e6edf3; background: rgba(255,255,255,0.06); }
  .ai-chat-messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .ai-chat-messages::-webkit-scrollbar { width: 4px; }
  .ai-chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .ai-msg { max-width: 88%; font-size: 13px; line-height: 1.55; }
  .ai-msg.bot { align-self: flex-start; }
  .ai-msg.user { align-self: flex-end; }
  .ai-msg-bubble { padding: 10px 13px; border-radius: 14px; word-wrap: break-word; white-space: pre-wrap; }
  .ai-msg.bot .ai-msg-bubble {
    background: rgba(255,255,255,0.06); color: #e6edf3; border-bottom-left-radius: 4px;
  }
  .ai-msg.user .ai-msg-bubble {
    background: linear-gradient(135deg, rgba(79,172,254,0.25), rgba(0,242,254,0.15));
    color: #e6edf3; border-bottom-right-radius: 4px;
  }
  .ai-msg-time { font-size: 10px; color: rgba(230,237,243,0.3); margin-top: 3px; padding: 0 3px; }
  .ai-msg.user .ai-msg-time { text-align: right; }

  /* Categories */
  .ai-cat-tabs {
    padding: 8px 14px 0; display: flex; gap: 6px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .ai-cat-tab {
    padding: 4px 10px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; font-size: 11px; color: rgba(230,237,243,0.6);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .ai-cat-tab:hover, .ai-cat-tab.active {
    background: rgba(79,172,254,0.15); border-color: rgba(79,172,254,0.3); color: #4facfe;
  }
  .ai-chat-suggestions {
    padding: 6px 14px 10px; display: flex; flex-wrap: wrap; gap: 5px;
  }
  .ai-sugg {
    padding: 5px 11px; background: rgba(79,172,254,0.08);
    border: 1px solid rgba(79,172,254,0.2); border-radius: 20px;
    font-size: 11px; color: #4facfe; cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
  }
  .ai-sugg:hover { background: rgba(79,172,254,0.2); }
  .ai-chat-input-bar {
    padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #ai-chat-input {
    flex: 1; background: rgba(28,33,48,0.9); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 9px 13px; color: #e6edf3; font-size: 13px;
    outline: none; resize: none; min-height: 38px; max-height: 96px;
    font-family: inherit; line-height: 1.4;
  }
  #ai-chat-input:focus { border-color: rgba(79,172,254,0.4); }
  #ai-chat-send {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s;
  }
  #ai-chat-send:hover { opacity: 0.85; }
  #ai-chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
  #ai-chat-send svg { width: 17px; height: 17px; fill: white; }
  .ai-typing {
    display: flex; align-items: center; gap: 4px; padding: 10px 13px;
    background: rgba(255,255,255,0.06); border-radius: 14px;
    border-bottom-left-radius: 4px; width: fit-content;
  }
  .ai-dot {
    width: 6px; height: 6px; background: rgba(230,237,243,0.5); border-radius: 50%;
    animation: ai-bounce 1.4s infinite ease-in-out;
  }
  .ai-dot:nth-child(1) { animation-delay: 0s; }
  .ai-dot:nth-child(2) { animation-delay: 0.2s; }
  .ai-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes ai-bounce { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }
</style>

<!-- Кнопка виджета -->
<button id="ai-widget-btn" onclick="toggleAiChat()" title="ИИ Ассистент Решид">
  <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12C2 13.85 2.5 15.55 3.35 17L2 22L7 20.65C8.45 21.5 10.17 22 12 22C17.52 22 22 17.52 22 12S17.52 2 12 2M17.26 14.33C17 14.19 15.78 13.59 15.53 13.5C15.29 13.41 15.11 13.36 14.93 13.63C14.75 13.9 14.29 14.46 14.14 14.63C13.99 14.81 13.84 14.83 13.57 14.7C13.31 14.56 12.47 14.29 11.47 13.39C10.7 12.7 10.19 11.84 10.04 11.57C9.89 11.3 10.02 11.16 10.16 11.02C10.29 10.9 10.46 10.7 10.6 10.55C10.73 10.4 10.78 10.29 10.87 10.11C10.96 9.93 10.92 9.78 10.85 9.64C10.78 9.5 10.27 8.28 10.05 7.77C9.83 7.27 9.6 7.34 9.44 7.33H8.94C8.76 7.33 8.47 7.4 8.22 7.67C7.98 7.94 7.32 8.55 7.32 9.78C7.32 11 8.26 12.18 8.4 12.36C8.53 12.54 10.27 15.22 12.93 16.29C13.56 16.56 14.05 16.72 14.44 16.83C15.07 17.03 15.64 17 16.09 16.93C16.59 16.85 17.61 16.31 17.84 15.72C18.07 15.13 18.07 14.63 18 14.53C17.93 14.43 17.52 14.46 17.26 14.33Z"/></svg>
  <span class="badge"></span>
</button>

<!-- Панель чата -->
<div id="ai-chat-panel">
  <div class="ai-chat-header">
    <div class="ai-chat-avatar">
      <svg viewBox="0 0 24 24"><path d="M17.5 12A1.5 1.5 0 0 1 16 10.5A1.5 1.5 0 0 1 17.5 9A1.5 1.5 0 0 1 19 10.5A1.5 1.5 0 0 1 17.5 12M14.5 8A1.5 1.5 0 0 1 13 6.5A1.5 1.5 0 0 1 14.5 5A1.5 1.5 0 0 1 16 6.5A1.5 1.5 0 0 1 14.5 8M9.5 8A1.5 1.5 0 0 1 8 6.5A1.5 1.5 0 0 1 9.5 5A1.5 1.5 0 0 1 11 6.5A1.5 1.5 0 0 1 9.5 8M6.5 12A1.5 1.5 0 0 1 5 10.5A1.5 1.5 0 0 1 6.5 9A1.5 1.5 0 0 1 8 10.5A1.5 1.5 0 0 1 6.5 12M12 3A9 9 0 0 0 3 12A9 9 0 0 0 12 21A9 9 0 0 0 21 12A9 9 0 0 0 12 3Z"/></svg>
    </div>
    <div>
      <div class="ai-chat-name">Решид — ИИ Ассистент</div>
      <div class="ai-chat-status">● Онлайн · Ski Rent</div>
    </div>
    <button class="ai-chat-close" onclick="toggleAiChat()">✕</button>
  </div>

  <div class="ai-chat-messages" id="ai-messages">
    <div class="ai-msg bot">
      <div class="ai-msg-bubble">Привет! Я Решид — ваш ИИ-ассистент Ski Rent. Помогу разобраться в системе: аренды, договоры, платежи, клиенты. Выберите тему или задайте вопрос!</div>
      <div class="ai-msg-time">Сейчас</div>
    </div>
  </div>

  <!-- Категории вопросов -->
  <div class="ai-cat-tabs" id="ai-cat-tabs">
    <span class="ai-cat-tab active" onclick="setCategory(this,'main')">Главное</span>
    <span class="ai-cat-tab" onclick="setCategory(this,'rentals')">Аренды</span>
    <span class="ai-cat-tab" onclick="setCategory(this,'payments')">Платежи</span>
    <span class="ai-cat-tab" onclick="setCategory(this,'clients')">Клиенты</span>
    <span class="ai-cat-tab" onclick="setCategory(this,'equipment')">Снаряжение</span>
  </div>

  <div class="ai-chat-suggestions" id="ai-suggestions"></div>

  <div class="ai-chat-input-bar">
    <textarea id="ai-chat-input" placeholder="Задайте вопрос..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAiMsg()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,96)+'px'"></textarea>
    <button id="ai-chat-send" onclick="sendAiMsg()">
      <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3V10L17 12 2 14V21Z"/></svg>
    </button>
  </div>
</div>

<script>
let aiHistory = [];
const CSRF = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';

const AI_SUGGESTIONS = {
  main: [
    'Как создать аренду?',
    'Статусы аренды',
    'Роли пользователей',
    'Как подписать договор?',
    'Где аналитика?',
  ],
  rentals: [
    'Как создать аренду?',
    'Статусы аренды',
    'Как изменить даты аренды?',
    'Как отменить аренду?',
    'Как применить скидку?',
  ],
  payments: [
    'Как принять платёж?',
    'Как сделать возврат?',
    'Методы оплаты',
    'Статусы платежа',
    'Кто может создавать платежи?',
  ],
  clients: [
    'Как добавить клиента?',
    'Обязательные поля клиента',
    'Что такое ИИН?',
    'Как найти клиента?',
    'Именинники',
  ],
  equipment: [
    'Как добавить снаряжение?',
    'Статусы снаряжения',
    'Как посмотреть остатки?',
    'Снаряжение с размерами',
    'Что такое ведомость склада?',
  ],
};

function setCategory(el, cat) {
  document.querySelectorAll('.ai-cat-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderSuggestions(AI_SUGGESTIONS[cat] || []);
}

function renderSuggestions(list) {
  const box = document.getElementById('ai-suggestions');
  box.innerHTML = list.map(s => `<span class="ai-sugg" onclick="askSugg(this)">${s}</span>`).join('');
}

function toggleAiChat() {
  const panel = document.getElementById('ai-chat-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    document.getElementById('ai-chat-input').focus();
  }
}

function askSugg(el) {
  document.getElementById('ai-chat-input').value = el.textContent;
  sendAiMsg();
}

function timeStr() {
  return new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
}

function addMsg(text, role) {
  const msgs = document.getElementById('ai-messages');
  const div = document.createElement('div');
  div.className = `ai-msg ${role}`;
  const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  div.innerHTML = `<div class="ai-msg-bubble">${safe}</div><div class="ai-msg-time">${timeStr()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addTyping() {
  const msgs = document.getElementById('ai-messages');
  const div = document.createElement('div');
  div.className = 'ai-msg bot'; div.id = 'ai-typing';
  div.innerHTML = '<div class="ai-typing"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('ai-typing');
  if (t) t.remove();
}

async function sendAiMsg() {
  const input = document.getElementById('ai-chat-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  document.getElementById('ai-cat-tabs').style.display = 'none';
  document.getElementById('ai-suggestions').style.display = 'none';

  addMsg(text, 'user');
  aiHistory.push({ role: 'user', content: text });

  addTyping();
  document.getElementById('ai-chat-send').disabled = true;

  try {
    const res = await fetch('/ai-chat/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
      body: JSON.stringify({ message: text, history: aiHistory.slice(-10) }),
    });
    const data = await res.json();
    removeTyping();

    if (data.no_key) {
      const msgs = document.getElementById('ai-messages');
      const div = document.createElement('div');
      div.className = 'ai-msg bot';
      div.innerHTML = `<div class="ai-msg-bubble" style="color:#d29922">
        ⚙️ API-ключ не настроен.<br><br>
        <a href="/settings/" style="color:#4facfe;font-weight:600">Открыть настройки</a> — займёт 1 минуту.<br>
        <small style="opacity:0.6">Ключ: console.groq.com/keys</small>
      </div><div class="ai-msg-time">${timeStr()}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    } else {
      const reply = data.reply || 'Извините, не удалось получить ответ.';
      addMsg(reply, 'bot');
      aiHistory.push({ role: 'assistant', content: reply });
    }
  } catch (e) {
    removeTyping();
    addMsg('Ошибка соединения. Проверьте интернет и попробуйте позже.', 'bot');
  } finally {
    document.getElementById('ai-chat-send').disabled = false;
    input.focus();
  }
}

// Инициализация: показать подсказки категории "Главное"
renderSuggestions(AI_SUGGESTIONS.main);
</script>
