{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Ski Rent CRM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    /* Логотип / заголовок */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.4);
    }
    .brand-icon svg {
      width: 36px;
      height: 36px;
      fill: white;
    }
    .brand h1 {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand p {
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      margin-top: 4px;
    }

    /* Карточка */
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .card-title {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card-sub {
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      margin-bottom: 28px;
    }

    /* Ошибка */
    .alert-error {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      color: #fca5a5;
      font-size: 14px;
    }
    .alert-error svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    /* Поля */
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input:focus {
      border-color: #4facfe;
      background: rgba(79,172,254,0.08);
      box-shadow: 0 0 0 3px rgba(79,172,254,0.15);
    }

    /* Кнопка */
    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(79,172,254,0.4);
    }
    .btn-submit:hover { opacity: 0.92; box-shadow: 0 8px 28px rgba(79,172,254,0.55); }
    .btn-submit:active { transform: scale(0.98); }

    /* Футер карточки */
    .footer-note {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">

    <div class="brand">
      <div class="brand-icon">
        <!-- Лыжи иконка -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.5 3.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2v14a6 6 0 0 0 6 6 6 6 0 0 0 6-6V2l-1.5 1.5zM18 16a4 4 0 0 1-4 4 4 4 0 0 1-4-4V4h8v12z"/>
        </svg>
      </div>
      <h1>Ski Rent CRM</h1>
      <p>Система управления прокатом снаряжения</p>
    </div>

    <div class="card">
      <div class="card-title">Вход в систему</div>
      <div class="card-sub">Введите ваши учётные данные для доступа</div>

      {% if error %}
      <div class="alert-error">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" autocomplete="off">
        {% csrf_token %}

        <div class="form-group">
          <label for="username">Имя пользователя</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Введите логин"
              value="{{ request.POST.username|default:'' }}"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Введите пароль"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-submit">Войти в систему</button>
      </form>
      <div class="footer-note" style="margin-top:12px;">
        Нет аккаунта? <a href="{% url 'register' %}" style="color:#8fd3ff;">Регистрация</a>
      </div>

      <div class="footer-note">
        Система защищена. Несанкционированный доступ запрещён.
      </div>
    </div>

  </div>
</body>
</html>
